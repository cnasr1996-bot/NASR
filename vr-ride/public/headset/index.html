<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NASR VR Ride — Headset</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #05070d; color: #e8ecf5; font: 18px/1.4 system-ui, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #panel {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(560px, calc(100% - 32px)); padding: 28px; border-radius: 18px;
      background: rgba(14, 18, 30, .92); box-shadow: 0 20px 60px rgba(0,0,0,.6); text-align: center;
    }
    h1 { margin: 0 0 4px; font-size: 26px; }
    .muted { color: #8b93a7; font-size: 15px; }
    #enter {
      margin: 22px 0 10px; width: 100%; padding: 22px; border: 0; border-radius: 14px;
      background: #2f7bff; color: #fff; font-size: 26px; font-weight: 700; cursor: pointer;
    }
    #enter:disabled { background: #33394a; color: #8b93a7; cursor: default; }
    .row { display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 12px; }
    select, button.small { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid #39405a; background: #1a2033; color: inherit; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #e5484d; margin-inline-end: 6px; }
    .dot.ok { background: #30a46c; }
    #warn { color: #ffb224; font-size: 15px; margin-top: 12px; }
    #panel.hidden { display: none; }
  </style>
  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three-addons/" } }
  </script>
</head>
<body>
  <div id="panel">
    <h1>NASR VR Ride</h1>
    <div class="muted" id="seatLabel">Seat —</div>
    <button id="enter" disabled>Checking VR…</button>
    <div><span class="dot" id="connDot"></span><span id="connText">Connecting to ride server…</span></div>
    <div class="row">
      <label class="muted" for="seatSelect">Seat</label>
      <select id="seatSelect"></select>
      <button class="small" id="preview">2D preview</button>
    </div>
    <div id="warn"></div>
  </div>
  <script type="module" src="headset.js"></script>
</body>
</html>
